name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and check dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: SDK field map matches the installed SDK
        run: npm run check-sdk-map

      - name: Rebuild dist
        run: npm run build

      - name: dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git status --porcelain dist
            git diff --stat dist
            exit 1
          fi

  smoke:
    name: Action loads on the runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No API key is given, so the action must stop at input validation
      # without calling the API.
      - id: run
        uses: ./
        continue-on-error: true
        with:
          api-key: ''
          profile: ci
          platforms: x
          text: smoke test

      - name: Expect a clean input error
        run: |
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "::error::Expected the action to fail on the missing api-key, got ${{ steps.run.outcome }}"
            exit 1
          fi
